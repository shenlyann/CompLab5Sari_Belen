services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      - inventory-service
      - order-service
      - payment-service
      - notification-service

  inventory-service:
    build: ./inventory-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  order-service:
    build: ./order-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002

  payment-service:
    build: ./payment-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003

  notification-service:
    build: ./notification-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
